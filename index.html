<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffd98e">
<title>꼬마 택배 놀이 마을</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff4e6;color:#70452c;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:560px;margin:auto;padding:14px}.hero{background:#ffd98e;border-radius:24px;padding:16px;text-align:center}
h1{font-size:27px;margin:5px}h2{font-size:21px;margin:0 0 12px}.sub{margin:4px 0 12px}
.banner{font-size:56px;padding:12px;background:#fff0d9;border-radius:18px;margin-top:10px}
.card{background:white;border-radius:20px;padding:17px;margin-top:13px;box-shadow:0 3px 12px #70452c12}
.item{display:flex;align-items:center;gap:10px;background:#fff6ea;padding:11px;border-radius:15px;margin:9px 0}
.emoji{font-size:36px}.grow{flex:1}.price{font-size:13px;color:#8c725f}
button{border:0;border-radius:14px;padding:13px 15px;font-size:16px;font-weight:750;background:#59a96a;color:white;cursor:pointer}
button.secondary{background:#eee7df;color:#70452c}button:disabled{opacity:.4}.full{width:100%;margin-top:10px}
.total{background:#fff0d9;padding:14px;border-radius:14px;margin-top:12px;font-weight:800}
.notice{font-size:12px;text-align:center;margin:14px 0;color:#8c725f}
.big{font-size:70px;text-align:center}.stage{background:#e8f5ff;border-radius:18px;text-align:center;padding:18px;margin:12px 0}
.track{display:grid;gap:8px;margin:14px 0}.track div{padding:10px;border-radius:12px;background:#f6f1eb;color:#a99b8d}.track .active{background:#e4f5e8;color:#27834c;font-weight:800}
.road{height:112px;background:linear-gradient(#dff3ff 0 58%,#777 58% 100%);border-radius:16px;position:relative;overflow:hidden;margin:12px 0}
.road:after{content:"";position:absolute;left:0;right:0;bottom:20px;border-top:4px dashed white}
.truck{position:absolute;z-index:2;bottom:22px;left:5%;font-size:52px;filter:drop-shadow(0 3px 1px #5555)}
.truck.go{animation:drive 3.2s ease-in-out infinite alternate}
@keyframes drive{from{transform:translateX(0)}to{transform:translateX(245px)}}
.speech{background:#fff0d9;border-radius:14px;padding:12px;margin-top:10px;line-height:1.5}
@media(max-width:380px){.truck.go{animation-name:driveSmall}@keyframes driveSmall{from{transform:translateX(0)}to{transform:translateX(175px)}}}
</style>
</head>
<body><main>
<header class="hero">
<div style="font-size:14px;font-weight:800">한빛반 11월 놀이</div>
<h1>🚚 꼬마 택배 놀이 마을</h1>
<p class="sub">고르고! 주문하고! 택배 받아보자!</p>
<div class="banner">🧸 🚚 📦</div>
</header>
<section id="app" class="card"></section>
<p class="notice">🌟 상상 속 쇼핑과 배송 체험이에요. 실제 결제·주문·배송은 이루어지지 않아요.</p>
</main>
<script>
const products=[
{name:"색종이",emoji:"🎨",price:1000},{name:"아기 인형",emoji:"👶",price:5000},
{name:"악기",emoji:"🥁",price:4000},{name:"벽돌블록",emoji:"🧱",price:3000},
{name:"레고블록",emoji:"🧩",price:4500},{name:"도넛",emoji:"🍩",price:2000}
];
const stages=[
["🛍️","상품 선택","마음에 드는 물건을 골랐어요!","안녕 친구야! 가게에서 마음에 드는 물건을 골라보자!"],
["🧺","장바구니 담기","물건이 장바구니에 들어갔어요!","장바구니에 쏙 들어갔네! 어떤 물건을 골랐는지 살펴보자!"],
["📝","주문 완료","주문이 접수되었어요!","주문이 완료됐어요! 이제 택배를 준비할게요!"],
["📦","상품 준비 중","물건을 예쁘게 포장하고 있어요!","택배 아저씨가 물건을 상자에 조심조심 담고 있어요!"],
["🚚","택배 출발!","택배 자동차가 출발했어요!","부릉부릉! 택배 자동차가 출발합니다! 안전하게 배달할게요!"],
["🏡","배송 완료!","딩동! 택배가 도착했어요!","딩동딩동! 택배 왔어요! 기다리던 선물이 도착했어요!"]
];
let cart=[],page="shop",step=0;
const app=document.getElementById("app"),won=n=>n.toLocaleString("ko-KR")+"원";
const stageAudioFiles=["1.m4a","2.m4a","3.m4a","4.m4a","5.m4a","6.m4a"];
const stageAudio=new Audio();
function playStageAudio(index){
 stageAudio.pause();
 stageAudio.currentTime=0;
 const file=stageAudioFiles[index];
 if(!file)return; // 4~6번 음성은 파일을 받으면 연결할게요.
 stageAudio.src=file;
 stageAudio.load();
 stageAudio.play().catch(()=>{});
}
function speak(text){
 stageAudio.pause();
 stageAudio.currentTime=0;
 if(!("speechSynthesis" in window)){alert("이 기기에서는 음성 안내를 지원하지 않아요. 화면의 안내 글을 읽어주세요!");return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=0.88;u.pitch=1.12;
 const voices=window.speechSynthesis.getVoices();const ko=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ko"));if(ko)u.voice=ko;
 window.speechSynthesis.speak(u);
}
function render(){
 if(page==="shop"){
 app.innerHTML=`<h2>1. 장난감 가게 🏪</h2><p>어떤 물건을 사고 싶니?</p>${products.map((p,i)=>`<div class="item"><div class="emoji">${p.emoji}</div><div class="grow"><b>${p.name}</b><div class="price">놀이 가격 ${won(p.price)}</div></div><button onclick="add(${i})">담기</button></div>`).join("")}<div class="total">🧺 내 장바구니<br>${cart.length?cart.map(p=>p.emoji+" "+p.name).join(" · "):"아직 물건이 없어요!"}</div><button class="full" ${cart.length?"":"disabled"} onclick="page='cart';render()">장바구니 확인하기 ➡️</button>`;
 }else if(page==="cart"){
 app.innerHTML=`<h2>2. 주문하기 🧺</h2>${cart.map((p,i)=>`<div class="item"><span class="emoji">${p.emoji}</span><b class="grow">${p.name}</b><span>${won(p.price)}</span><button class="secondary" onclick="removeItem(${i})">빼기</button></div>`).join("")}<div class="total">총 놀이 금액: ${won(cart.reduce((a,p)=>a+p.price,0))}</div><p class="price">실제 결제는 없어요. 숫자 공부를 위한 놀이 금액이에요.</p><button class="full" ${cart.length?"":"disabled"} onclick="page='ordered';render()">주문할게요! 💛</button><button class="full secondary" onclick="page='shop';render()">가게로 돌아가기</button>`;
 }else if(page==="ordered"){
 app.innerHTML=`<h2>3. 주문 완료! 🎉</h2><div class="big">📋</div><h2 style="text-align:center;color:#27834c">주문이 접수되었어요!</h2><p style="text-align:center">이제 택배 아저씨가 준비할 거예요.</p><div class="total"><b>주문한 물건</b><br>${cart.map(p=>p.emoji+" "+p.name).join("<br>")}</div><button class="full" onclick="page='delivery';step=0;render()">택배 배송 구경하기 🚚</button>`;
 }else{
 const s=stages[step];
 app.innerHTML=`<h2>4. 택배가 오고 있어요!</h2><div class="stage"><div class="big">${s[0]}</div><h2>${s[1]}</h2><p>${s[2]}</p>${step===4?'<div class="road"><div class="truck go">🚚</div></div>':step===5?'<div style="font-size:48px">🚚 ➡️ 🏡 📦</div>':''}<div class="speech">🧑‍✈️ 택배 아저씨: ${s[3]}</div><button class="full" onclick="playStageAudio(step)">🔊 택배 아저씨 목소리 듣기</button></div><div class="track">${stages.map((x,i)=>`<div class="${i<=step?"active":""}">${i<=step?"✓":"○"} ${x[0]} ${x[1]}</div>`).join("")}</div>${step<5?`<button class="full" onclick="step++;render()">다음 배송 과정 보기 ➡️</button>`:`<h2 style="text-align:center;color:#27834c">🎊 배송 완료!</h2><button class="full" onclick="cart=[];page='shop';step=0;render()">다시 쇼핑하기 🛍️</button>`}`;
 }
}
function add(i){cart.push(products[i]);render()}
function removeItem(i){cart.splice(i,1);render()}
render();
</script></body></html>
